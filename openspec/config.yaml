schema: spec-driven

context: |
  Follow AGENTS.md for stack, conventions, and runtime rules.
  Verify with `bun test tests`, `bunx tsc --noEmit`, `call(router...)`.

rules:
  specs:
    - Delta only; state observable REST + RPC behavior.
  tasks:
    - One verifiable step each.

operations:
  apply:
    guidance:
      - Keep summaries concise; verify OpenAPI paths.
  archive:
    guidance:
      - Summarize specs updated and procedures changed.
