services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    container_name: abogoboga-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abogoboga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abogoboga}
      POSTGRES_DB: ${POSTGRES_DB:-abogoboga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
