services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    container_name: abogoboga-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-abogoboga}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-abogoboga}
      POSTGRES_DB: ${POSTGRES_DB:-abogoboga}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # Local trace collector. One container: OTLP/HTTP receiver, in-memory trace
  # storage, and the query UI. Configuration lives in jaeger/config.yaml.
  # Traces only - logs and metrics are neither received nor stored.
  jaeger:
    image: jaegertracing/jaeger:2.6.0
    restart: unless-stopped
    container_name: abogoboga-jaeger
    command: ["--config", "/jaeger/config.yaml"]
    volumes:
      - ./jaeger/config.yaml:/jaeger/config.yaml:ro
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${OTEL_COLLECTOR_PORT:-4318}:4318"

volumes:
  postgres_data:
